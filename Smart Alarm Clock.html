<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Smart Alarm Clock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Martian+Mono:wght@400;500;600&display=swap">
<style>
  /* Layout: one quiet column. The big time is the only loud thing; the form and the alarm list sit below as flat panels. */
  :root {
    --bg: #e7ecef;
    --panel: #f5f8f9;
    --raised: #ffffff;
    --line: #c9d4da;
    --ink: #13212b;
    --muted: #566872;
    --accent: #0b7480;
    --accent-ink: #ffffff;
    --accent-soft: #d3ebee;
    --ring: #c2410c;
    --thumb: #ffffff;
    --scrim: rgba(19, 33, 43, 0.55);
    --shadow: 0 1px 2px rgba(19, 33, 43, 0.08), 0 12px 32px rgba(19, 33, 43, 0.14);
    --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-digits: "Martian Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1418;
      --panel: #111e24;
      --raised: #162830;
      --line: #27393f;
      --ink: #e2edf0;
      --muted: #93a8b1;
      --accent: #45c7d2;
      --accent-ink: #04191c;
      --accent-soft: #143840;
      --ring: #ff8f5e;
      --thumb: #e2edf0;
      --scrim: rgba(3, 8, 10, 0.74);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 12px 32px rgba(0, 0, 0, 0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1418;
    --panel: #111e24;
    --raised: #162830;
    --line: #27393f;
    --ink: #e2edf0;
    --muted: #93a8b1;
    --accent: #45c7d2;
    --accent-ink: #04191c;
    --accent-soft: #143840;
    --ring: #ff8f5e;
    --thumb: #e2edf0;
    --scrim: rgba(3, 8, 10, 0.74);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 12px 32px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font: 400 1rem/1.5 var(--font-body);
    padding-block: clamp(20px, 5vw, 48px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  :where(button, input):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { font: inherit; color: inherit; }

  .app { max-width: 30rem; margin-inline: auto; display: grid; gap: 20px; }

  /* Clock face */
  .topline { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; }
  .date { margin: 0; font-size: 0.875rem; color: var(--muted); letter-spacing: 0.02em; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--panel); }
  .seg button {
    border: 0; background: none; padding: 5px 14px; border-radius: 999px; cursor: pointer;
    font-size: 0.8125rem; font-weight: 500; color: var(--muted);
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .time {
    margin: 0.5rem 0 0; display: flex; align-items: flex-start; gap: 0.6rem; min-width: 0;
    font-family: var(--font-digits); font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums;
  }
  .time-main { font-size: clamp(3rem, 16.5vw, 4.75rem); letter-spacing: -0.05em; }
  .time-side { display: flex; flex-direction: column; gap: 0.4rem; padding-top: 0.4rem; font-size: clamp(1rem, 4.6vw, 1.375rem); letter-spacing: -0.02em; }
  .time-sec { color: var(--accent); }
  .time-ampm { color: var(--muted); font-size: 0.72em; letter-spacing: 0.06em; }
  .next { margin: 0.9rem 0 0; font-size: 0.9375rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
  .next-k { font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; padding-top: 2px; }
  .next-v { color: var(--ink); min-width: 0; }

  /* Panels */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .panel-head h2, .panel > h2 {
    margin: 0; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: var(--muted);
  }
  .panel > h2 { margin-bottom: 14px; }
  .count { font-size: 0.8125rem; color: var(--muted); }

  .fields { display: grid; grid-template-columns: minmax(0, 9.5rem) minmax(0, 1fr); gap: 12px; }
  @media (max-width: 380px) { .fields { grid-template-columns: minmax(0, 1fr); } }
  .field { display: grid; gap: 6px; min-width: 0; align-content: start; }
  .field > label, .group-label { font-size: 0.8125rem; font-weight: 500; }
  .input {
    width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--raised); color: var(--ink); font: inherit;
  }
  .input:focus-visible { border-color: var(--accent); outline-offset: 1px; }
  input[type="time"].input { font-family: var(--font-digits); font-size: 0.9375rem; }
  .input::placeholder { color: var(--muted); opacity: 0.85; }

  .group { margin-top: 14px; }
  .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
  .day {
    min-height: 40px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--raised);
    color: var(--muted); font-size: 0.8125rem; font-weight: 500; cursor: pointer;
  }
  .day[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
  .presets { display: flex; flex-wrap: wrap; gap: 0 16px; margin-top: 4px; }
  .linkbtn {
    background: none; border: 0; padding: 8px 0; color: var(--accent); font-size: 0.8125rem; font-weight: 500;
    cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
  }
  .summary { margin: 10px 0 0; font-size: 0.875rem; color: var(--muted); min-height: 1.3em; }
  .summary b { color: var(--ink); font-weight: 500; }
  .err { margin: 8px 0 0; font-size: 0.875rem; color: var(--ring); min-height: 1.3em; }
  .err:empty { margin: 0; min-height: 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .btn {
    min-height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--raised); color: var(--ink); font-weight: 500; cursor: pointer;
  }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.06); }
  .sound-note { margin: 12px 0 0; font-size: 0.8125rem; color: var(--muted); }

  /* Alarm list */
  .alarms { list-style: none; margin: 0; padding: 0; }
  .alarm { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
  .alarm:first-child { border-top: 0; padding-top: 0; }
  .alarm:last-child { padding-bottom: 0; }
  .alarm-time { font: 500 1.75rem/1.1 var(--font-digits); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  .alarm-time small { font-size: 0.75rem; letter-spacing: 0.04em; margin-left: 0.4rem; color: var(--muted); }
  .alarm.off .alarm-time { color: var(--muted); }
  .alarm-meta { margin-top: 4px; font-size: 0.875rem; color: var(--muted); overflow-wrap: anywhere; }
  .alarm-label { color: var(--ink); }
  .alarm.off .alarm-label { color: var(--muted); }
  .tag {
    display: inline-block; margin-left: 6px; padding: 0 7px; border: 1px solid var(--line); border-radius: 999px;
    font-size: 0.6875rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); vertical-align: 1px;
  }
  .controls { display: flex; align-items: center; gap: 8px; }
  .switch {
    position: relative; flex: none; width: 48px; height: 30px; padding: 0; border-radius: 999px;
    border: 1px solid var(--line); background: var(--line); cursor: pointer; transition: background 0.15s;
  }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--thumb); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); transition: transform 0.15s;
  }
  .switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
  .switch[aria-checked="true"]::after { transform: translateX(18px); }
  .iconbtn {
    display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 8px;
    background: none; color: var(--muted); cursor: pointer;
  }
  .iconbtn:hover { background: var(--raised); color: var(--ring); }
  .iconbtn svg { width: 20px; height: 20px; }
  .empty { margin: 0; color: var(--muted); font-size: 0.9375rem; }

  /* Ringing dialog */
  .ring {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--scrim);
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    overflow-y: auto;
  }
  .ring-card {
    width: min(26rem, 100%); background: var(--raised); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 22px;
  }
  .eyebrow { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: var(--ring); }
  .pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--ring); animation: pulse 1.4s ease-out infinite; flex: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ring) 55%, transparent); } 100% { box-shadow: 0 0 0 12px transparent; } }
  .more { margin-left: auto; color: var(--muted); letter-spacing: 0.04em; text-transform: none; font-weight: 500; }
  .ring-title { margin: 14px 0 2px; font-size: 1.5rem; line-height: 1.2; font-weight: 600; text-wrap: balance; overflow-wrap: anywhere; }
  .ring-time { margin: 0; font-family: var(--font-digits); font-size: 0.9375rem; color: var(--muted); }
  .puzzle { margin: 6px 0 10px; font-family: var(--font-digits); font-size: 1.75rem; font-weight: 500; letter-spacing: -0.03em; }
  .ring-form { margin-top: 18px; display: grid; gap: 4px; }
  .ring-form .input { font-family: var(--font-digits); font-size: 1.25rem; text-align: center; min-height: 52px; }
  .ring-actions { display: grid; gap: 10px; margin-top: 8px; }
  .shake { animation: shake 0.3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .ring-sound { margin: 12px 0 0; font-size: 0.8125rem; color: var(--muted); }

  /* Toast */
  .toast-wrap {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: center; pointer-events: none;
    padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .toast {
    pointer-events: auto; display: flex; align-items: center; gap: 14px; max-width: 30rem; padding: 10px 14px;
    background: var(--ink); color: var(--bg); border-radius: 10px; font-size: 0.875rem; box-shadow: var(--shadow);
  }
  .toast button { border: 0; background: none; padding: 4px 2px; color: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

  @media (prefers-reduced-motion: reduce) {
    .pulse, .shake { animation: none; }
    .switch, .switch::after { transition: none; }
  }
</style>

<main class="app" id="app">
  <header>
    <div class="topline">
      <p class="date" id="live-date">&nbsp;</p>
      <div class="seg" role="group" aria-label="Time format">
        <button type="button" id="fmt-12" aria-pressed="true">12h</button>
        <button type="button" id="fmt-24" aria-pressed="false">24h</button>
      </div>
    </div>
    <p class="time" aria-label="Current time">
      <span class="time-main" id="clk-main">0:00</span>
      <span class="time-side" aria-hidden="true">
        <span class="time-sec" id="clk-sec">00</span>
        <span class="time-ampm" id="clk-ampm">AM</span>
      </span>
    </p>
    <p class="next"><span class="next-k">Next alarm</span> <span class="next-v" id="next-v">None set</span></p>
  </header>

  <section class="panel" aria-labelledby="new-h">
    <h2 id="new-h">New alarm</h2>
    <form id="alarm-form" novalidate>
      <div class="fields">
        <div class="field">
          <label for="alarm-time">Time</label>
          <input class="input" type="time" id="alarm-time" value="07:00" required>
        </div>
        <div class="field">
          <label for="alarm-label">Label</label>
          <input class="input" type="text" id="alarm-label" maxlength="40" placeholder="Wake up" autocomplete="off">
        </div>
      </div>

      <div class="group" role="group" aria-labelledby="repeat-l">
        <span class="group-label" id="repeat-l">Repeat</span>
        <div class="days" id="days"></div>
        <div class="presets">
          <button type="button" class="linkbtn" data-preset="weekdays">Weekdays</button>
          <button type="button" class="linkbtn" data-preset="weekends">Weekends</button>
          <button type="button" class="linkbtn" data-preset="daily">Every day</button>
          <button type="button" class="linkbtn" data-preset="once">Once</button>
        </div>
      </div>

      <p class="summary" id="form-summary" aria-live="polite"></p>
      <p class="err" id="form-msg" role="alert"></p>
      <div class="actions">
        <button type="submit" class="btn primary" id="add-btn">Add alarm</button>
        <button type="button" class="btn" id="test-sound">Play test sound</button>
      </div>
      <p class="sound-note" id="sound-note"></p>
    </form>
  </section>

  <section class="panel" aria-labelledby="list-h">
    <div class="panel-head">
      <h2 id="list-h">Your alarms</h2>
      <span class="count" id="count"></span>
    </div>
    <ul class="alarms" id="alarms-list"></ul>
  </section>
</main>

<div class="ring" id="ring" hidden role="alertdialog" aria-modal="true" aria-labelledby="ring-title" aria-describedby="ring-time">
  <div class="ring-card">
    <p class="eyebrow"><span class="pulse"></span>Alarm ringing<span class="more" id="ring-more"></span></p>
    <h2 class="ring-title" id="ring-title">Alarm</h2>
    <p class="ring-time" id="ring-time"></p>
    <form class="ring-form" id="ring-form" novalidate>
      <label for="math-answer" class="group-label">Solve this to switch it off</label>
      <p class="puzzle" id="math-question"></p>
      <input class="input" id="math-answer" type="text" inputmode="numeric" autocomplete="off" aria-describedby="math-question ring-error" placeholder="Your answer">
      <p class="err" id="ring-error" role="alert"></p>
      <div class="ring-actions">
        <button type="submit" class="btn primary" id="dismiss-btn">Dismiss alarm</button>
        <button type="button" class="btn" id="snooze-btn">Snooze 5 minutes</button>
      </div>
    </form>
    <p class="ring-sound" id="ring-sound" hidden>Your browser is holding back the sound. Click or tap anywhere on this page to turn it on.</p>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  const STORE_KEY = 'smart-alarm-clock.v1';
  const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const DAY_ORDER = [1, 2, 3, 4, 5, 6, 0];
  const SNOOZE_MIN = 5;
  const LATE_WINDOW_MS = 10 * 60 * 1000;   // an alarm missed by a sleeping tab still rings if it is under 10 minutes late
  const DEFAULT_TIME = '07:00';
  const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';

  const $ = (id) => document.getElementById(id);
  const el = {
    app: $('app'), date: $('live-date'), main: $('clk-main'), sec: $('clk-sec'), ampm: $('clk-ampm'), next: $('next-v'),
    fmt12: $('fmt-12'), fmt24: $('fmt-24'),
    form: $('alarm-form'), time: $('alarm-time'), label: $('alarm-label'), days: $('days'), summary: $('form-summary'),
    msg: $('form-msg'), test: $('test-sound'), soundNote: $('sound-note'),
    list: $('alarms-list'), count: $('count'),
    ring: $('ring'), ringTitle: $('ring-title'), ringTime: $('ring-time'), ringMore: $('ring-more'),
    ringForm: $('ring-form'), question: $('math-question'), answer: $('math-answer'), ringErr: $('ring-error'),
    dismiss: $('dismiss-btn'), snooze: $('snooze-btn'), ringSound: $('ring-sound'),
    toast: $('toast-wrap'),
  };
  const baseTitle = document.title;

  // ---------- state ----------
  const state = { alarms: [], use24h: false };
  const draftDays = new Set();
  let queue = [];        // alarms currently ringing: { id, at }
  let snoozes = [];      // { id, at }
  let lastTick = Date.now();
  let puzzle = null;
  let shownId = null;
  let lastFocus = null;

  const pad = (n) => String(n).padStart(2, '0');
  const uid = () => 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const find = (id) => state.alarms.find((a) => a.id === id);
  const rnd = (lo, hi) => Math.floor(Math.random() * (hi - lo + 1)) + lo;

  // ---------- storage (per-browser convenience; every call guarded) ----------
  function clean(a) {
    if (!a || typeof a.time !== 'string' || !/^\d{2}:\d{2}$/.test(a.time)) return null;
    const [h, m] = a.time.split(':').map(Number);
    if (h > 23 || m > 59) return null;
    const days = Array.isArray(a.days) ? [...new Set(a.days.filter((n) => Number.isInteger(n) && n >= 0 && n <= 6))].sort((x, y) => x - y) : [];
    return {
      id: String(a.id || '').replace(/[^\w-]/g, '').slice(0, 40) || uid(),
      time: a.time,
      label: String(a.label || 'Alarm').slice(0, 40),
      days, enabled: a.enabled !== false, sample: !!a.sample,
    };
  }
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d && Array.isArray(d.alarms)) {
          state.alarms = d.alarms.map(clean).filter(Boolean);
          state.use24h = !!d.use24h;
          return true;
        }
      }
    } catch (e) { /* storage unavailable: start fresh */ }
    return false;
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ alarms: state.alarms, use24h: state.use24h })); } catch (e) { /* ignore */ }
  }
  function sortAlarms() {
    state.alarms.sort((a, b) => a.time.localeCompare(b.time) || a.label.localeCompare(b.label));
  }

  // ---------- time helpers ----------
  function parts(h, m) {
    if (state.use24h) return { t: pad(h) + ':' + pad(m), s: '' };
    return { t: (h % 12 || 12) + ':' + pad(m), s: h < 12 ? 'AM' : 'PM' };
  }
  function fmtHM(str) {
    const [h, m] = str.split(':').map(Number);
    const p = parts(h, m);
    return p.s ? p.t + ' ' + p.s : p.t;
  }
  function fmtStamp(ts) {
    const d = new Date(ts);
    const p = parts(d.getHours(), d.getMinutes());
    return p.s ? p.t + ' ' + p.s : p.t;
  }
  function dayWord(ts, now) {
    const a = new Date(ts), b = new Date(now);
    const da = new Date(a.getFullYear(), a.getMonth(), a.getDate());
    const db = new Date(b.getFullYear(), b.getMonth(), b.getDate());
    const diff = Math.round((da - db) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Tomorrow';
    return DAY_NAMES[a.getDay()];
  }
  function relative(ms) {
    const mins = Math.max(1, Math.ceil(ms / 60000));
    const d = Math.floor(mins / 1440), h = Math.floor((mins % 1440) / 60), m = mins % 60;
    if (d) return d + ' d ' + h + ' h';
    if (h) return h + ' h ' + m + ' min';
    return m + ' min';
  }
  function daysText(days) {
    const key = [...days].sort((a, b) => a - b).join(',');
    if (!days.length) return 'Once';
    if (key === '0,1,2,3,4,5,6') return 'Every day';
    if (key === '1,2,3,4,5') return 'Weekdays';
    if (key === '0,6') return 'Weekends';
    return DAY_ORDER.filter((d) => days.includes(d)).map((d) => DAY_NAMES[d]).join(', ');
  }
  // first moment after `from` when an alarm with this time and weekday set rings
  function nextOccurrence(time, days, from) {
    const [h, m] = time.split(':').map(Number);
    for (let off = 0; off <= 7; off++) {
      const d = new Date(from);
      d.setDate(d.getDate() + off);
      d.setHours(h, m, 0, 0);
      if (d.getTime() > from && (!days.length || days.includes(d.getDay()))) return d.getTime();
    }
    return null;
  }
  // alarms whose scheduled moment falls in (from, to]
  function dueBetween(from, to) {
    const out = [];
    for (const a of state.alarms) {
      if (!a.enabled) continue;
      const [h, m] = a.time.split(':').map(Number);
      for (let off = -1; off <= 0; off++) {
        const d = new Date(to);
        d.setDate(d.getDate() + off);
        d.setHours(h, m, 0, 0);
        const t = d.getTime();
        if (t > from && t <= to && to - t <= LATE_WINDOW_MS && (!a.days.length || a.days.includes(d.getDay()))) {
          out.push({ id: a.id, at: t });
        }
      }
    }
    return out;
  }

  // ---------- tiny DOM helper (text only, never innerHTML for user content) ----------
  function h(tag, props, ...kids) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v === false || v == null) continue;
      if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null) node.append(kid);
    return node;
  }
  const setText = (node, text) => { if (node.textContent !== text) node.textContent = text; };

  // ---------- sound (Web Audio, started only after a user gesture) ----------
  let audioCtx = null, soundTimer = null;
  function ensureAudio() {
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        audioCtx = new AC();
        audioCtx.onstatechange = updateSoundStatus;
      }
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      return true;
    } catch (e) { return false; }
  }
  function beepSeries() {
    if (!audioCtx || audioCtx.state !== 'running') return;
    const t0 = audioCtx.currentTime + 0.03;
    for (let i = 0; i < 4; i++) {
      const t = t0 + i * 0.22;
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = i % 2 ? 1175 : 988;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.14, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.2);
    }
  }
  function startSound() {
    if (soundTimer) return;
    ensureAudio();
    beepSeries();
    soundTimer = setInterval(beepSeries, 1400);
  }
  function stopSound() { clearInterval(soundTimer); soundTimer = null; }
  function soundReady() { return !!audioCtx && audioCtx.state === 'running'; }
  function updateSoundStatus() {
    const ready = soundReady();
    setText(el.soundNote, ready ? 'Sound is on. Alarms will beep until you dismiss or snooze them.' : 'Sound switches on after your first click or tap on this page.');
    el.ringSound.hidden = ready;
  }

  // ---------- toast ----------
  let toastTimer = null;
  function toast(message, actionLabel, onAction) {
    clearTimeout(toastTimer);
    el.toast.replaceChildren();
    const box = h('div', { class: 'toast' }, h('span', { text: message }));
    if (actionLabel) {
      box.append(h('button', { type: 'button', text: actionLabel, onclick: () => { el.toast.replaceChildren(); onAction(); } }));
    }
    el.toast.append(box);
    toastTimer = setTimeout(() => el.toast.replaceChildren(), actionLabel ? 7000 : 4000);
  }

  // ---------- rendering ----------
  function renderClock(now) {
    const d = new Date(now);
    const p = parts(d.getHours(), d.getMinutes());
    setText(el.main, p.t);
    setText(el.sec, pad(d.getSeconds()));
    setText(el.ampm, p.s);
    el.ampm.hidden = !p.s;
    setText(el.date, d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }));
  }

  function nextRing(now) {
    let best = null;
    for (const a of state.alarms) {
      if (!a.enabled) continue;
      const t = nextOccurrence(a.time, a.days, now);
      if (t && (!best || t < best.t)) best = { t, a };
    }
    for (const s of snoozes) {
      const a = find(s.id);
      if (a && (!best || s.at < best.t)) best = { t: s.at, a };
    }
    return best;
  }
  function renderNext(now) {
    let text;
    if (queue.length) text = 'Ringing now';
    else {
      const best = nextRing(now);
      text = best ? dayWord(best.t, now) + ' ' + fmtStamp(best.t) + ' · in ' + relative(best.t - now) + ' · ' + best.a.label : 'No alarm is switched on';
    }
    setText(el.next, text);
  }
  function renderSummary(now) {
    const v = el.time.value;
    if (!/^\d{2}:\d{2}$/.test(v)) { setText(el.summary, 'Pick a time to see when this alarm will ring.'); return; }
    const days = [...draftDays];
    const t = nextOccurrence(v, days, now);
    setText(el.summary, 'Next ring: ' + dayWord(t, now) + ' ' + fmtStamp(t) + ' (in ' + relative(t - now) + ') · ' + daysText(days));
  }

  function renderDays() {
    el.days.replaceChildren(...DAY_ORDER.map((d) => h('button', {
      type: 'button', class: 'day', 'data-day': d, text: DAY_NAMES[d],
      'aria-pressed': draftDays.has(d) ? 'true' : 'false',
      onclick: () => { draftDays.has(d) ? draftDays.delete(d) : draftDays.add(d); renderDays(); renderSummary(Date.now()); },
    })));
  }

  function rowFor(a) {
    const p = parts(...a.time.split(':').map(Number));
    const name = a.label + ' at ' + fmtHM(a.time);
    return h('li', { class: 'alarm' + (a.enabled ? '' : ' off'), 'data-id': a.id },
      h('div', { style: 'min-width:0' },
        h('div', { class: 'alarm-time' }, p.t, p.s ? h('small', { text: p.s }) : null),
        h('div', { class: 'alarm-meta' },
          h('span', { class: 'alarm-label', text: a.label }),
          ' · ' + daysText(a.days),
          a.sample ? h('span', { class: 'tag', text: 'Example' }) : null)),
      h('div', { class: 'controls' },
        h('button', { type: 'button', class: 'switch', role: 'switch', 'aria-checked': a.enabled ? 'true' : 'false', 'aria-label': name, onclick: () => toggleAlarm(a.id) }),
        h('button', { type: 'button', class: 'iconbtn', 'aria-label': 'Delete ' + name, onclick: () => removeAlarm(a.id) })));
  }
  function renderList() {
    el.list.replaceChildren();
    el.count.textContent = state.alarms.length ? state.alarms.length + (state.alarms.length === 1 ? ' alarm' : ' alarms') : '';
    if (!state.alarms.length) {
      el.list.append(h('li', {}, h('p', { class: 'empty', text: 'No alarms yet. Choose a time above and press Add alarm.' })));
      return;
    }
    for (const a of state.alarms) {
      const row = rowFor(a);
      row.querySelector('.iconbtn').innerHTML = TRASH;   // static markup only
      el.list.append(row);
    }
  }
  function renderAll() {
    const now = Date.now();
    el.fmt12.setAttribute('aria-pressed', String(!state.use24h));
    el.fmt24.setAttribute('aria-pressed', String(state.use24h));
    renderClock(now); renderNext(now); renderSummary(now); renderList(); updateSoundStatus();
  }

  // ---------- alarm actions ----------
  function toggleAlarm(id) {
    const a = find(id);
    if (!a) return;
    a.enabled = !a.enabled;
    if (a.enabled) a.sample = false;
    else { queue = queue.filter((q) => q.id !== id); snoozes = snoozes.filter((s) => s.id !== id); }
    save(); renderList(); showRing(); renderNext(Date.now());
    const sw = el.list.querySelector('[data-id="' + id + '"] .switch');
    if (sw) sw.focus();
    if (a.enabled) {
      const t = nextOccurrence(a.time, a.days, Date.now());
      toast('Alarm on. It rings ' + dayWord(t, Date.now()).toLowerCase() + ' at ' + fmtStamp(t) + '.');
    } else toast('Alarm off.');
  }
  function removeAlarm(id) {
    const i = state.alarms.findIndex((a) => a.id === id);
    if (i < 0) return;
    const [gone] = state.alarms.splice(i, 1);
    queue = queue.filter((q) => q.id !== id);
    snoozes = snoozes.filter((s) => s.id !== id);
    save(); renderList(); showRing(); renderNext(Date.now());
    toast('Alarm deleted.', 'Undo', () => {
      state.alarms.push(gone); sortAlarms(); save(); renderList(); renderNext(Date.now());
    });
  }

  // ---------- ringing ----------
  function newPuzzle() {
    const a = rnd(3, 9), b = rnd(3, 9), c = rnd(10, 49);
    puzzle = { text: a + ' × ' + b + ' + ' + c, answer: a * b + c };
    el.question.textContent = puzzle.text + ' = ?';
  }
  function enqueue(id, at) {
    if (!find(id) || queue.some((q) => q.id === id)) return;
    queue.push({ id, at });
  }
  function showRing() {
    if (!queue.length) {
      if (!el.ring.hidden) {
        el.ring.hidden = true;
        el.app.inert = false;
        if (lastFocus && lastFocus.focus) lastFocus.focus();
      }
      shownId = null;
      stopSound();
      document.title = baseTitle;
      return;
    }
    const top = queue[0];
    const a = find(top.id);
    if (!a) { queue.shift(); showRing(); return; }
    const opening = el.ring.hidden;
    const changed = shownId !== top.id;
    if (opening) { lastFocus = document.activeElement; el.ring.hidden = false; el.app.inert = true; }
    if (changed) { shownId = top.id; newPuzzle(); el.answer.value = ''; el.ringErr.textContent = ''; }
    const late = Math.floor((Date.now() - top.at) / 60000);
    el.ringTitle.textContent = a.label;
    el.ringTime.textContent = fmtHM(a.time) + (late >= 1 ? ' · missed by ' + late + ' min' : '');
    el.ringMore.textContent = queue.length > 1 ? '+' + (queue.length - 1) + ' more' : '';
    document.title = 'Alarm: ' + a.label;
    updateSoundStatus();
    startSound();
    if (opening || changed) el.answer.focus();
  }

  el.ringForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const v = el.answer.value.trim();
    if (v !== '' && Number(v) === puzzle.answer) {
      const top = queue.shift();
      const a = find(top.id);
      snoozes = snoozes.filter((s) => s.id !== top.id);
      let note = 'Alarm dismissed.';
      if (a && !a.days.length) { a.enabled = false; note = 'Alarm dismissed and switched off.'; save(); renderList(); }
      showRing(); renderNext(Date.now());
      toast(note);
    } else {
      el.ringErr.textContent = 'That is not right. Try again.';
      el.answer.value = '';
      el.answer.focus();
      el.answer.classList.remove('shake');
      void el.answer.offsetWidth;
      el.answer.classList.add('shake');
    }
  });
  el.snooze.addEventListener('click', () => {
    const top = queue.shift();
    const at = Date.now() + SNOOZE_MIN * 60000;
    snoozes.push({ id: top.id, at });
    showRing(); renderNext(Date.now());
    toast('Snoozed until ' + fmtStamp(at) + '.');
  });
  el.ring.addEventListener('keydown', (e) => {          // keep Tab inside the dialog
    if (e.key !== 'Tab') return;
    const items = [el.answer, el.dismiss, el.snooze];
    const i = items.indexOf(document.activeElement);
    const next = e.shiftKey ? (i <= 0 ? items.length - 1 : i - 1) : (i === items.length - 1 ? 0 : i + 1);
    e.preventDefault();
    items[next].focus();
  });

  // ---------- clock loop ----------
  function tick() {
    const now = Date.now();
    if (now < lastTick) lastTick = now;                 // system clock moved back
    for (const due of dueBetween(lastTick, now)) enqueue(due.id, due.at);
    const woke = snoozes.filter((s) => s.at <= now);
    if (woke.length) { snoozes = snoozes.filter((s) => s.at > now); woke.forEach((s) => enqueue(s.id, s.at)); }
    lastTick = now;
    renderClock(now);
    renderNext(now);
    renderSummary(now);
    if (queue.length) showRing();
  }

  // ---------- form ----------
  el.form.addEventListener('submit', (e) => {
    e.preventDefault();
    ensureAudio();
    const t = el.time.value;
    if (!/^\d{2}:\d{2}$/.test(t)) {
      el.msg.textContent = 'Pick a time for the alarm.';
      el.time.focus();
      return;
    }
    el.msg.textContent = '';
    const a = { id: uid(), time: t, label: el.label.value.trim() || 'Alarm', days: [...draftDays].sort((x, y) => x - y), enabled: true, sample: false };
    state.alarms.push(a);
    sortAlarms(); save(); renderList();
    const when = nextOccurrence(a.time, a.days, Date.now());
    toast('Alarm set. It rings ' + dayWord(when, Date.now()).toLowerCase() + ' at ' + fmtStamp(when) + '.');
    el.label.value = '';
    el.time.value = DEFAULT_TIME;
    draftDays.clear();
    renderDays(); renderSummary(Date.now()); renderNext(Date.now()); updateSoundStatus();
  });
  el.time.addEventListener('input', () => { el.msg.textContent = ''; renderSummary(Date.now()); });
  document.querySelector('.presets').addEventListener('click', (e) => {
    const k = e.target.closest('[data-preset]');
    if (!k) return;
    const sets = { weekdays: [1, 2, 3, 4, 5], weekends: [0, 6], daily: [0, 1, 2, 3, 4, 5, 6], once: [] };
    draftDays.clear();
    sets[k.dataset.preset].forEach((d) => draftDays.add(d));
    renderDays(); renderSummary(Date.now());
  });
  el.test.addEventListener('click', async () => {
    if (!ensureAudio()) { toast('This browser cannot play alarm sounds.'); return; }
    try { await audioCtx.resume(); } catch (e) { /* ignore */ }
    beepSeries();
    updateSoundStatus();
    if (!soundReady()) toast('Sound is still blocked. Check that your device is not muted.');
  });
  for (const [btn, is24] of [[el.fmt12, false], [el.fmt24, true]]) {
    btn.addEventListener('click', () => { state.use24h = is24; save(); renderAll(); });
  }
  const unlock = () => { ensureAudio(); updateSoundStatus(); };
  document.addEventListener('pointerdown', unlock, { once: true, capture: true });
  document.addEventListener('keydown', unlock, { once: true, capture: true });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

  // ---------- start ----------
  if (!load()) {
    state.alarms = [
      { id: 'sample-weekday', time: '06:45', label: 'Wake up', days: [1, 2, 3, 4, 5], enabled: false, sample: true },
      { id: 'sample-weekend', time: '09:00', label: 'Weekend lie-in', days: [0, 6], enabled: false, sample: true },
    ];
  }
  sortAlarms();
  renderDays();
  renderAll();
  setInterval(tick, 500);
})();
</script>

</body></html>
